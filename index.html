<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tic-Tac-Toe</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-rounded, "Segoe UI", sans-serif;
        background: #10131d;
        color: #f7f8ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 1.25rem;
        background:
          radial-gradient(circle at 20% 20%, #28214a 0, transparent 32rem),
          radial-gradient(circle at 80% 80%, #123c46 0, transparent 28rem),
          #10131d;
      }

      main {
        width: min(100%, 28rem);
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.35rem, 11vw, 4.25rem);
        letter-spacing: -0.07em;
      }

      .tagline {
        margin: 0.35rem 0 1.6rem;
        color: #aeb5cc;
      }

      .game {
        padding: clamp(1rem, 4vw, 1.5rem);
        border: 1px solid #ffffff1a;
        border-radius: 1.6rem;
        background: #171b28d9;
        box-shadow: 0 1.5rem 4rem #0006;
        backdrop-filter: blur(1rem);
      }

      #status {
        min-height: 1.8rem;
        margin: 0 0 1rem;
        font-size: 1.15rem;
        font-weight: 700;
      }

      #status.win {
        color: #70ebba;
      }

      .board {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: clamp(0.45rem, 2vw, 0.7rem);
      }

      .cell {
        display: grid;
        place-items: center;
        aspect-ratio: 1;
        padding: 0;
        border: 0;
        border-radius: 1rem;
        background: #252a3b;
        color: inherit;
        font-family: inherit;
        font-size: clamp(2.5rem, 15vw, 5rem);
        font-weight: 800;
        line-height: 1;
        cursor: pointer;
        transition: transform 120ms ease, background 120ms ease;
      }

      .cell:hover:not(:disabled),
      .cell:focus-visible {
        background: #30364b;
        transform: translateY(-2px);
        outline: 3px solid #8e7dff;
        outline-offset: 2px;
      }

      .cell:disabled {
        cursor: default;
        opacity: 1;
      }

      .cell.x {
        color: #ff8cad;
      }

      .cell.o {
        color: #6fdfe9;
      }

      #new-game {
        width: 100%;
        min-height: 3rem;
        margin-top: 1rem;
        border: 0;
        border-radius: 0.85rem;
        background: #8e7dff;
        color: #10131d;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }

      #new-game:hover,
      #new-game:focus-visible {
        background: #ab9fff;
        outline: 3px solid #fff;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Tic-Tac-Toe</h1>
      <p class="tagline">Three in a row takes the round.</p>
      <section class="game" aria-label="Tic-Tac-Toe game">
        <p id="status" aria-live="polite">X's turn</p>
        <div class="board" aria-label="Game board">
          <button class="cell" data-index="0" aria-label="Top left"></button>
          <button class="cell" data-index="1" aria-label="Top middle"></button>
          <button class="cell" data-index="2" aria-label="Top right"></button>
          <button class="cell" data-index="3" aria-label="Middle left"></button>
          <button class="cell" data-index="4" aria-label="Center"></button>
          <button class="cell" data-index="5" aria-label="Middle right"></button>
          <button class="cell" data-index="6" aria-label="Bottom left"></button>
          <button class="cell" data-index="7" aria-label="Bottom middle"></button>
          <button class="cell" data-index="8" aria-label="Bottom right"></button>
        </div>
        <button id="new-game" type="button">New game</button>
      </section>
    </main>
    <script src="game.js"></script>
  </body>
</html>
